      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#f2a33a" flood-opacity="0.65"/>
    </filter>
    <clipPath id="card"><rect width="1200" height="560" rx="20"/></clipPath>
  </defs>
