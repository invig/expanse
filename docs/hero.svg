<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="title desc">
  <title id="title">Expanse</title>
  <desc id="desc">Windows in groups on an infinite canvas in deep space, seen zoomed out: the focused window outlined in amber, more windows running off the edges, and the Spaces strip and minimap in the corner.</desc>
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1b40"/>
      <stop offset="0.6" stop-color="#03091e"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <radialGradient id="portal" cx="0.47" cy="0.46" r="0.6">
      <stop offset="0" stop-color="#3086d1" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#3086d1" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#3086d1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="corner" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#80d1fc" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#80d1fc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1b40"/><stop offset="1" stop-color="#03091e"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="150%">
